name: Generate Sling-wing Game Icon Assets

on:
  workflow_dispatch:
  push:
    branches:
      - ga-me2
    paths:
      - "Public/icone.svg"
      - ".github/workflows/build-android-icon.yml"

permissions:
  contents: read

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ga-me2
        uses: actions/checkout@v4
        with:
          ref: ga-me2

      - name: Validate SVG source
        shell: bash
        run: |
          set -euo pipefail
          test -s Public/icone.svg
          grep -q '<svg' Public/icone.svg
          echo "Validated Public/icone.svg"

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Generate web and Android launcher icon assets
        shell: bash
        run: |
          set -euo pipefail

          OUT="generated-game-icons"
          mkdir -p "$OUT/web" "$OUT/android/res/drawable-nodpi" "$OUT/android/res/values" "$OUT/android/res/mipmap-anydpi-v26"

          # Preserve the complete original artwork and its proportions on a square
          # canvas. The SVG already uses #699AD3 as its background colour.
          rsvg-convert --width 1024 --height 768 Public/icone.svg > "$OUT/landscape.png"
          convert "$OUT/landscape.png" -background '#699AD3' -gravity center -extent 1024x1024 "$OUT/icon-1024.png"

          # Web favicon and installable web-app icon files.
          cp Public/icone.svg "$OUT/web/favicon.svg"
          for size in 192 512; do
            convert "$OUT/icon-1024.png" -filter Lanczos -resize "${size}x${size}" "$OUT/web/icon-${size}.png"
          done
          convert "$OUT/icon-1024.png" -define icon:auto-resize=256,128,64,48,32,16 "$OUT/web/favicon.ico"

          # Android legacy launcher icons at the standard density dimensions.
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$OUT/android/res/mipmap-$density"
            convert "$OUT/icon-1024.png" -filter Lanczos -resize "${size}x${size}" "$OUT/android/res/mipmap-$density/ic_launcher.png"
            # Adaptive foreground canvas is 108dp, corresponding to 432px at xxxhdpi.
            fg_size=$((size * 9 / 4))
            convert "$OUT/icon-1024.png" -filter Lanczos -resize "${fg_size}x${fg_size}" "$OUT/android/res/mipmap-$density/ic_launcher_foreground.png"
          done

          cp "$OUT/icon-1024.png" "$OUT/android/res/drawable-nodpi/ic_launcher_source.png"

          cat > "$OUT/android/res/values/ic_launcher_background.xml" <<'XML'
          <resources>
              <color name="ic_launcher_background">#699AD3</color>
          </resources>
          XML

          cat > "$OUT/android/res/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML

          cat > "$OUT/README.txt" <<'TXT'
          Sling-wing icon assets generated from Public/icone.svg.

          Web:
          - web/favicon.svg
          - web/favicon.ico
          - web/icon-192.png
          - web/icon-512.png

          Android:
          Copy the contents of android/res/ into the Android app module's src/main/res/.
          In AndroidManifest.xml, set android:icon and android:roundIcon to @mipmap/ic_launcher.
          The current Sling-wing repository is a static web-game source and does not contain
          an AndroidManifest.xml or Gradle wrapper, so this workflow generates the icon pack
          but intentionally does not claim to build an APK.
          TXT

          test -s "$OUT/web/icon-192.png"
          test -s "$OUT/web/icon-512.png"
          test -s "$OUT/android/res/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$OUT/android/res/mipmap-xxxhdpi/ic_launcher_foreground.png"
          echo "Icon generation validation passed."
          find "$OUT" -type f -print | sort

      - name: Upload generated icon pack
        uses: actions/upload-artifact@v4
        with:
          name: Sling-wing-game-icon-assets
          path: generated-game-icons/
          if-no-files-found: error
          retention-days: 30
