name: Build Sling Wing APK

on:
  push:
    branches:
      - main
      - Games
      - Game1
  pull_request:
    branches:
      - main
      - Games
      - Game1
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

# Prevent rapid consecutive pushes from consuming runner time and artifact quota.
concurrency:
  group: sling-wing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare game assets
        run: npm run prepare-www

      - name: Check game JavaScript syntax
        run: node --check src/js/game.js

      - name: Run game integrity checks
        run: npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Generate launcher icons from SVG artwork
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/values" "$RES/mipmap-anydpi-v26"
          rsvg-convert --width 1024 --height 768 src/assets/icone.svg > /tmp/sling-wing-icon-landscape.png
          convert /tmp/sling-wing-icon-landscape.png -background '#699AD3' -gravity center -extent 1024x1024 /tmp/sling-wing-icon.png

          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            convert /tmp/sling-wing-icon.png -filter Lanczos -resize "${size}x${size}" "$RES/mipmap-$density/ic_launcher.png"
            fg_size=$((size * 9 / 4))
            convert /tmp/sling-wing-icon.png -filter Lanczos -resize "${fg_size}x${fg_size}" "$RES/mipmap-$density/ic_launcher_foreground.png"
          done

          cp /tmp/sling-wing-icon.png "$RES/drawable-nodpi/ic_launcher_source.png"
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <resources>
              <color name="ic_launcher_background">#699AD3</color>
          </resources>
          XML
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML

          python3 - android/app/src/main/AndroidManifest.xml <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          match = re.search(r"<application\b[^>]*>", content)
          if not match:
              raise SystemExit("AndroidManifest.xml has no <application> element")
          tag = match.group(0)
          tag = re.sub(r'\s+android:icon="[^"]*"', "", tag)
          tag = re.sub(r'\s+android:roundIcon="[^"]*"', "", tag)
          tag = tag[:-1] + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">'
          path.write_text(content[:match.start()] + tag + content[match.end():], encoding="utf-8")
          PY

          test -s "$RES/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"

      - name: Sync Capacitor
        run: npm run sync

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sling-wing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      # Actions artifact storage can be exhausted independently of Android build capacity.
      # Publish the APK as a prerelease asset only when artifact upload fails on the main game branch.
      - name: Publish APK fallback release
        if: steps.upload_apk.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/Games'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Sling Wing APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Fallback APK because GitHub Actions artifact upload failed. Commit: ${GITHUB_SHA}"
