name: Build Sling Wing APK

on:
  push:
    branches:
      - main
      - Games
  pull_request:
    branches:
      - Games
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

# Prevent rapid consecutive pushes from consuming runner time and artifact quota.
concurrency:
  group: sling-wing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare game assets
        run: npm run prepare-www

      - name: Check game JavaScript syntax
        run: node --check src/js/game.js

      - name: Run game integrity checks
        run: npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npm run sync

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sling-wing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      # Actions artifact storage can be exhausted independently of Android build capacity.
      # Publish the APK as a prerelease asset only when artifact upload fails on the main game branch.
      - name: Publish APK fallback release
        if: steps.upload_apk.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/Games'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Sling Wing APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Fallback APK because GitHub Actions artifact upload failed. Commit: ${GITHUB_SHA}"
